<!DOCTYPE html>
<html lang="en" data-theme="medieval">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="characterSelectScreen" class="character-select-screen" aria-hidden="false">
  <div class="character-select-panel">
    <h1 class="character-select-title">Select character</h1>
    <p class="character-select-lead muted">Create up to five heroes. Each has separate progress.</p>
    <div id="characterSelectSlots" class="character-select-slots"></div>
    <button type="button" id="characterSelectPlayBtn" class="btn-primary character-select-play" disabled>Play</button>
  </div>
</div>

<div class="container hidden">
  <div class="content" id="content"></div>
</div>

<div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-label="Loading">
  <div class="loading-card">
    <div id="loadingText" class="loading-text">Loading…</div>
    <div class="loading-bar" aria-hidden="true">
      <div id="loadingBarFill" class="loading-bar-fill"></div>
    </div>
  </div>
</div>

<div class="bottom-hud hidden" id="bottomHud">
  <section class="bottom-hud-chat" aria-label="Chat">
    <div class="bottom-chat-head">Chat</div>
    <div id="bottomChatLog" class="bottom-chat-log" aria-live="polite">
      <p><strong>System:</strong> Welcome to the world.</p>
      <p><strong>Guide:</strong> Open Adventure to explore.</p>
    </div>
    <input class="bottom-chat-input" type="text" placeholder="Type a message..." aria-label="Chat message" disabled>
  </section>

  <section class="bottom-hud-center" aria-label="Character status">
    <div id="bottomHudPortrait" class="bottom-hud-portrait" aria-label="Character portrait"></div>
    <div class="bottom-hud-hp" aria-label="Health">
      <div class="bottom-hud-hp-fill" id="bottomHudHpFill"></div>
    </div>
    <div class="bottom-hud-meta"><span id="bottomHudName">Hero</span> · <span id="bottomHudHpText">100 / 100 HP</span></div>
  </section>

  <section class="bottom-hud-right">
    <div class="bottom-menu-row">
      <nav class="bottom-menu" aria-label="Main menu">
        <button type="button" id="characterPanelBtn" class="bottom-menu-btn" data-tooltip="Character (C)" onclick="openCharacterPanel()">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/character.png" alt="Character icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Character</span>
        </button>
        <button type="button" id="skillsPanelBtn" class="bottom-menu-btn" data-tooltip="Skills (S)" onclick="openSkillsPanel()">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/skills.png" alt="Skills icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Skills</span>
        </button>
        <button type="button" id="arenaPanelBtn" class="bottom-menu-btn" data-tooltip="Arena (A)" onclick="openMenuPanel('arena')">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/arena.png" alt="Arena icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Arena</span>
        </button>
        <button type="button" id="alliancePanelBtn" class="bottom-menu-btn" data-tooltip="Alliance (G)" onclick="openMenuPanel('alliance')">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/alliance.png" alt="Alliance icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Alliance</span>
        </button>
        <button type="button" id="marketPanelBtn" class="bottom-menu-btn" data-tooltip="Market (B)" onclick="openMenuPanel('market')">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/market.png" alt="Market icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Market</span>
        </button>
        <button type="button" id="craftingPanelBtn" class="bottom-menu-btn" data-tooltip="Crafting (P)" onclick="openMenuPanel('crafting')">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/crafting.png" alt="Crafting icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Crafting</span>
        </button>
        <button type="button" id="atlasPanelBtn" class="bottom-menu-btn" data-tooltip="Atlas (U)" onclick="openMenuPanel('atlas')">
          <img class="bottom-menu-icon" src="Assets/UI/buttons/atlas.png" alt="Atlas icon" onerror="this.onerror=null;this.src='Assets/UI/buttons/default-menu.png';">
          <span class="sr-only">Atlas</span>
        </button>
      </nav>
      <div class="bottom-menu-tools">
        <div id="editModeAddPanel" class="sidebar-add-panel hidden">
          <button type="button" id="editModeAddBtn" class="sidebar-add-btn">Add object…</button>
          <button type="button" id="exportPortalLayoutBtn" class="sidebar-add-btn" title="Copy city waygate, boat, and NPC positions/sizes (from your save) as JSON for config.js">
            Export portal layout
          </button>
          <div id="editModeAddList" class="sidebar-add-list hidden" role="listbox" aria-label="Add editable object"></div>
        </div>
      </div>
      <select id="themeSelect" class="theme-select hidden" aria-hidden="true" tabindex="-1" aria-label="Game theme">
        <option value="medieval">Medieval</option>
        <option value="scifi">Sci‑Fi</option>
      </select>
    </div>
    <div class="bottom-hud-minimap" id="bottomHudMinimapSlot" aria-label="Minimap"></div>
  </section>
</div>

<div id="fightOverlay" class="fight-overlay fight-page hidden" aria-live="polite">
  <div class="fight-scene-backdrop" aria-hidden="true">
    <img id="fightSceneBackdropImg" class="fight-scene-backdrop__img" alt="" draggable="false" decoding="async" />
  </div>
  <div id="fightPhaseFlashOverlay" class="fight-phase-flash-overlay" aria-hidden="true"></div>
  <div class="fight-panel fight-panel--turn">
    <h3 class="fight-title">Combat</h3>
    <div class="fight-body">
      <div class="fight-main-column">
        <div class="fight-field-area">
          <div id="fightCombatFxLayer" class="fight-combat-fx-layer" aria-hidden="true"></div>
          <div id="fightHud" class="fight-hud"></div>
        </div>
        <div class="fight-bottom-strip">
          <section class="fight-chat-embed" aria-label="Chat">
            <div class="fight-chat-head">Chat</div>
            <div id="fightChatLog" class="fight-chat-log" aria-live="polite"></div>
            <input class="fight-chat-input" type="text" placeholder="Type a message..." aria-label="Chat message" disabled>
          </section>
          <div class="fight-controls-subpanel" aria-label="Combat actions">
            <div id="fightPlayerActions" class="fight-player-actions hidden"></div>
          </div>
        </div>
      </div>
      <aside class="fight-side-column">
        <div class="fight-log-section">
          <span class="fight-section-label">Combat log</span>
          <div id="fightLog" class="fight-log"></div>
        </div>
        <div id="fightMinimapSlot" class="fight-side-minimap" aria-label="Minimap"></div>
      </aside>
    </div>
  </div>
  <div id="fightResultsHost" class="fight-results-host hidden" aria-hidden="true">
    <div class="fight-results-host__scrim" aria-hidden="true"></div>
    <div id="fightResults" class="fight-results fight-results--modal hidden" role="dialog" aria-modal="true" aria-labelledby="fightResultsDialogTitle" aria-live="polite"></div>
  </div>
</div>

<div id="itemTooltip" class="item-tooltip hidden" role="tooltip" aria-hidden="true"></div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div id="modalContent"></div>
    <button type="button" onclick="closeModal()">Close</button>
  </div>
</div>

<div id="worldMapModal" class="world-map-modal hidden" aria-hidden="true" role="dialog" aria-labelledby="worldMapModalTitle">
  <div class="world-map-modal-panel">
    <header class="world-map-modal-head">
      <h2 id="worldMapModalTitle" class="world-map-modal-title">World map</h2>
      <div class="world-map-modal-head-actions">
        <div class="world-map-modal-zoom" role="group" aria-label="Map zoom">
          <button type="button" class="world-map-zoom-btn" id="worldMapZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
          <span class="world-map-zoom-value" id="worldMapZoomValue" aria-live="polite">—</span>
          <button type="button" class="world-map-zoom-btn" id="worldMapZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
        <button type="button" class="world-map-modal-close" id="worldMapModalClose" aria-label="Close world map">Close</button>
      </div>
    </header>
    <p class="world-map-modal-hint">Scroll wheel or +/−: zoom. Drag: pan.</p>
    <div class="world-map-modal-scroll" id="worldMapModalScroll">
      <div class="world-map-modal-canvas-wrap" id="worldMapModalCanvasWrap">
        <canvas id="worldMapCanvas" class="world-map-canvas" width="1" height="1" aria-label="World map"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="characterPanelModal" class="character-panel-modal hidden" aria-hidden="true" role="dialog" aria-label="Character">
  <div class="character-panel-shell">
    <div id="characterPanelContent" class="character-panel-content"></div>
  </div>
</div>

<div id="skillsPanelModal" class="character-panel-modal hidden" aria-hidden="true" role="dialog" aria-label="Skills">
  <div class="character-panel-shell">
    <div id="skillsPanelContent" class="character-panel-content"></div>
  </div>
</div>

<div id="menuPanelModal" class="character-panel-modal hidden" aria-hidden="true" role="dialog" aria-labelledby="menuPanelTitle">
  <div class="character-panel-shell menu-panel-shell">
    <header class="character-panel-head">
      <h2 id="menuPanelTitle" class="character-panel-title">Panel</h2>
      <button type="button" id="menuPanelClose" class="character-panel-close" aria-label="Close panel">Close</button>
    </header>
    <div id="menuPanelContent" class="character-panel-content"></div>
  </div>
</div>

<script src="world_map_data.js"></script>
<script src="config.js"></script>
<script src="portrait_character_presets.js"></script>
<script src="monster_drop_tables.js"></script>
<script src="skills_catalog.js"></script>
<script src="game.js"></script>
<script src="unified_skill_combat.js"></script>
</body>
</html>
